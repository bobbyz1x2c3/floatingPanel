[package]
name = "nemufloat"
version = "0.1.0"
description = "新拟态悬浮卡片 · 跨平台悬浮卡片面板"
authors = ["NemuFloat"]
edition = "2021"
rust-version = "1.77.2"

# 命令行工具（nemu）单独一个 crate：这样 src-tauri 这个包里只有一个二进制，
# 打包工具不会在 app 和 CLI 之间挑错。
[workspace]
members = ["cli"]

[lib]
name = "nemufloat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
opener = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
