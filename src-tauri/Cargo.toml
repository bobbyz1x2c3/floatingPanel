[package]
name = "nemufloat"
version = "0.1.0"
description = "新拟态悬浮卡片 · 跨平台悬浮卡片面板"
authors = ["NemuFloat"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nemufloat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
