name: Release

# 推一个 v* 标签（或在 Actions 里手动指定 tag）就会：
#   1) 先把 Release 建出来——这一步很快，也不依赖编译环境，所以即使后面某个平台编译失败，
#      版本页也不会缺席；
#   2) 再按平台矩阵并行打包，谁先打完谁先往同一个 Release 传附件；
#   3) 最后把各平台的安装包 + 签名汇总成一份 latest.json——自动更新靠它。
#      （tauri 自己只会写 `<安装包>.sig`，清单得我们自己拼；macOS 的更新包是 .app.tar.gz）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（例如 v0.2.0）
        required: true

permissions:
  contents: write
  actions: write

jobs:
  # ---------- 1. 先建 Release ----------
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析 tag
        id: resolve
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "NemuFloat $TAG" --notes-file .github/release-notes.md
          else
            gh release create "$TAG" --title "NemuFloat $TAG" --notes-file .github/release-notes.md
          fi

  # ---------- 2. 各平台并行打包 ----------
  bundle:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            slug: windows-x86_64
            os: windows-latest
            args: "--bundles nsis,msi"
          - name: macOS (Apple Silicon)
            slug: darwin-aarch64
            os: macos-latest
            args: "--bundles dmg --target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            slug: darwin-x86_64
            os: macos-latest
            args: "--bundles dmg --target x86_64-apple-darwin"
            target: x86_64-apple-darwin
          - name: Linux x64
            slug: linux-x86_64
            os: ubuntu-22.04
            args: "--bundles appimage,deb"
    runs-on: ${{ matrix.os }}
    name: 打包 · ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: 安装 Linux 依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装前端依赖
        run: npm ci

      - name: 打包
        env:
          # 自动更新要求安装包签名。密钥用 `npx tauri signer generate` 生成，
          # 私钥内容放进仓库 secret TAURI_SIGNING_PRIVATE_KEY。
          # 密码那一项：密钥没设密码的话，这个 secret 留空也要「存在」（GitHub 不允许空值，
          # 所以这里给了个默认空串），不然 tauri 会转去问交互式密码，CI 上就卡住了。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: npm run desktop:build -- ${{ matrix.args }}

      - name: 上传这个平台的产物
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.release.outputs.tag }}"
          # macOS 两个架构的 updater 包同名（都叫 NemuFloat.app.tar.gz），先按架构改名，
          # 不然先传完的会被后传的覆盖掉；改名后 .sig 也要跟着改。
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.app.tar.gz.sig) new="$(dirname "$f")/NemuFloat_${{ matrix.slug }}.app.tar.gz.sig" ;;
              *.app.tar.gz) new="$(dirname "$f")/NemuFloat_${{ matrix.slug }}.app.tar.gz" ;;
              *) continue ;;
            esac
            echo "改名 $f -> $new"
            mv "$f" "$new"
          done < <(find src-tauri/target -path "*/release/bundle/*" -type f \
            \( -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) \
            | grep -v -E "/(debug|\.tmp)/" | sort)

          count=0
          # 安装包 + macOS 的更新包（.app.tar.gz）+ 每份安装包的 .sig 签名。
          # 用 while read 而不是 mapfile：macOS runner 上的 bash 还是 3.2，没有 mapfile。
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "上传 $file"
            gh release upload "$tag" "$file" --clobber
            count=$((count + 1))
          done < <(find src-tauri/target -path "*/release/bundle/*" -type f \
            \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" \
               -o -name "*.deb" -o -name "*.rpm" -o -name "*.sig" -o -name "*.tar.gz" \) \
            | grep -v -E "/(debug|\.tmp)/" | sort)
          if [ "$count" -eq 0 ]; then
            echo "没有找到产物，检查一下打包步骤" >&2
            exit 1
          fi
          echo "本平台共上传 $count 个文件"

  # ---------- 3. 合并各平台的更新清单 ----------
  manifest:
    needs: [release, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 汇总 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.release.outputs.tag }}"
          repo="${{ github.repository }}"
          mkdir -p assets
          # 只取自动更新要用的东西：安装包 + 每份 .sig。
          gh release download "$tag" --repo "$repo" --dir assets --clobber \
            --pattern '*.exe' --pattern '*.msi' --pattern '*.AppImage' \
            --pattern '*.deb' --pattern '*.app.tar.gz' --pattern '*.sig'
          ls -l
          node scripts/make-updater-manifest.mjs \
            --dir assets --repo "$repo" --tag "$tag" \
            --notes .github/release-notes.md --out latest.json
          gh release upload "$tag" latest.json --clobber --repo "$repo"

  # ---------- 4. 发布页跟着更新 ----------
  pages:
    needs: [release, manifest]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 触发发布页重新部署
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main --repo ${{ github.repository }}
