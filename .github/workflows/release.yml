name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（例如 v0.1.0）
        required: true

permissions:
  contents: write
  actions: write

jobs:
  # 先把 Release 建出来：这一步很快，也不依赖任何编译环境，所以即使后面打包失败，
  # 版本页也不会缺席。
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "NemuFloat $TAG" --notes-file .github/release-notes.md
          else
            gh release create "$TAG" --title "NemuFloat $TAG" --notes-file .github/release-notes.md
          fi

  # 再在 Windows 上打安装包并传上去。装了签名密钥就把更新用的产物一起产出来。
  bundle:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 打包（Windows 安装包）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --bundles nsis

      - name: 上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload $tag src-tauri/target/release/bundle/nsis/*.exe --clobber
          # 配了签名密钥的话，更新用的 latest.json / *.sig 也一起传上去
          if (Test-Path src-tauri/target/release/bundle/nsis/latest.json) {
            gh release upload $tag src-tauri/target/release/bundle/nsis/latest.json --clobber
          }
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.sig -ErrorAction SilentlyContinue | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
          }

      - name: 顺手刷新发布页
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
